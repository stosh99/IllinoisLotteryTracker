name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: illinois_lottery_test
          POSTGRES_USER: lottery_test
          POSTGRES_PASSWORD: lottery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lottery_test -d illinois_lottery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lottery_test:lottery_test@127.0.0.1:5432/illinois_lottery_test
      TEST_DATABASE_URL: postgresql+psycopg://lottery_test:lottery_test@127.0.0.1:5432/illinois_lottery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic heads
      - run: pytest
      - run: ruff check .
