server {
    listen 80;
    listen [::]:80;
    server_name illinoislotterytracker.com www.illinoislotterytracker.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/illinoislotterytracker;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://illinoislotterytracker.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.illinoislotterytracker.com;

    ssl_certificate /etc/letsencrypt/live/illinoislotterytracker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/illinoislotterytracker.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    return 301 https://illinoislotterytracker.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name illinoislotterytracker.com;

    ssl_certificate /etc/letsencrypt/live/illinoislotterytracker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/illinoislotterytracker.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
