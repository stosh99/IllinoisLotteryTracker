# Edge configuration for scratchoffdata.com.
#
# Rate limits mirror the per-source table in
# docs/authentication_blueprint/05_security_privacy_and_operations.md. nginx
# expresses rates per minute, so 10 per 10 minutes is written as 1r/m.
#
# Zone and format names are prefixed `sod_` because sites-enabled files share
# the one http context on this host.

# Keys are empty for methods a zone does not police; an empty key disables the
# limit for that request, which is how one location can hold several policies.
map $request_method $sod_read_key {
    GET     $binary_remote_addr;
    HEAD    $binary_remote_addr;
    default "";
}

map $request_method $sod_write_key {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}

map $request_method $sod_destructive_key {
    POST    $binary_remote_addr;
    DELETE  $binary_remote_addr;
    default "";
}

limit_req_zone $binary_remote_addr   zone=sod_login_start:1m rate=1r/m;
limit_req_zone $binary_remote_addr   zone=sod_callback:1m    rate=3r/m;
limit_req_zone $sod_read_key         zone=sod_auth_read:1m   rate=12r/m;
limit_req_zone $sod_write_key        zone=sod_auth_write:1m  rate=6r/m;
limit_req_zone $sod_destructive_key  zone=sod_destructive:1m rate=1r/m;

# Logs the path only. The default `combined` format records $request, which
# would write the Google authorization code and state from the callback query
# string into the access log. Cookie and Set-Cookie are never referenced.
log_format sod_safe '$remote_addr - - [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name scratchoffdata.com www.scratchoffdata.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/scratchoffdata;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://scratchoffdata.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.scratchoffdata.com;

    ssl_certificate /etc/letsencrypt/live/scratchoffdata.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scratchoffdata.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    return 301 https://scratchoffdata.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scratchoffdata.com;

    ssl_certificate /etc/letsencrypt/live/scratchoffdata.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scratchoffdata.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/scratchoffdata.access.log sod_safe;
    error_log /var/log/nginx/scratchoffdata.error.log;

    # Inherited by every location below; only proxy_pass is set per location.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # A refused request must not be cached and must say when to retry.
    location @sod_rate_limited {
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 429;
    }

    # The callback carries a single-use code. A refusal returns a clean local
    # redirect instead of an error page, so no code or state survives in the
    # address bar and no account lookup happens.
    location @sod_callback_limited {
        add_header Cache-Control "no-store" always;
        return 303 https://scratchoffdata.com/?authResult=failed;
    }

    location = /api/v1/auth/google/start {
        limit_req zone=sod_login_start burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @sod_rate_limited;
        proxy_pass http://127.0.0.1:8766;
    }

    location = /api/v1/auth/google/callback {
        limit_req zone=sod_callback burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @sod_callback_limited;
        proxy_pass http://127.0.0.1:8766;
    }

    # Reauthentication and account deletion. The edge holds the coarse limit;
    # the application enforces the exact five-per-hour policy, which nginx
    # cannot express because its rates are per second or per minute.
    location = /api/v1/auth/google/reauth-delete {
        limit_req zone=sod_destructive burst=5 nodelay;
        limit_req zone=sod_auth_write burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @sod_rate_limited;
        proxy_pass http://127.0.0.1:8766;
    }

    location = /api/v1/account {
        limit_req zone=sod_destructive burst=5 nodelay;
        limit_req zone=sod_auth_read burst=30 nodelay;
        limit_req zone=sod_auth_write burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @sod_rate_limited;
        proxy_pass http://127.0.0.1:8766;
    }

    location ^~ /api/v1/auth/ {
        limit_req zone=sod_auth_read burst=30 nodelay;
        limit_req zone=sod_auth_write burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @sod_rate_limited;
        proxy_pass http://127.0.0.1:8766;
    }

    location ^~ /api/v1/ticket-entries {
        limit_req zone=sod_auth_read burst=30 nodelay;
        limit_req zone=sod_auth_write burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @sod_rate_limited;
        proxy_pass http://127.0.0.1:8766;
    }

    location / {
        proxy_pass http://127.0.0.1:8766;
    }
}
