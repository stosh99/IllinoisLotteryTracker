[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "illinois-lottery-tracker"
version = "0.1.0"
description = "Track Illinois Lottery instant ticket prize availability over time."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "brotli>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "playwright>=1.45",
    "fastapi>=0.116",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.35",
    "authlib>=1.6,<2",
    "cryptography>=50,<51",
    "httpx>=0.28,<1",
    "idna>=3.15,<4",
    "soupsieve>=2.8.4,<3",
    "urllib3>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10,<3",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
